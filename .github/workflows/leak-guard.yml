name: Leak Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan changed files for private data
        run: |
          set -euo pipefail
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          # Determine the range of commits to scan
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # First push / new branch / force-push: base object absent, so scan
          # against the empty tree instead of silently scanning nothing.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Base '$BASE' not present — scanning against the empty tree."
            BASE="$EMPTY_TREE"
          fi
          RANGE="$BASE..$HEAD"
          echo "Scanning range: $RANGE"

          # Fail closed: if the diff cannot be computed, do not pass.
          if ! RAW=$(git diff --name-only --diff-filter=ACMRT "$RANGE"); then
            echo "::error::git diff failed for range '$RANGE' — failing closed."
            exit 1
          fi
          FILES=$(printf '%s\n' "$RAW" | grep -v '^etsy-seller\.skill$' | grep -vE '^\.githooks/|^\.github/workflows/leak-guard' || true)

          if [ -z "$FILES" ]; then
            echo "No scannable text files changed."
            exit 0
          fi

          PATTERNS='Eighty9Crafts|ZPSCrafts|57438369|moiz-shop-intelligence|ETSY_SHOP_ID|lonelyscorpio|/Users/moiz'
          FOUND=0
          for f in $FILES; do
            [ -f "$f" ] || continue
            if grep -nE "$PATTERNS" "$f" > /dev/null 2>&1; then
              echo "::error file=$f::Private data pattern detected"
              grep -nE "$PATTERNS" "$f" | head -3
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Leak Guard FAILED — private data patterns found in changed files. Push rejected."
            exit 1
          fi
          echo "✅ Leak Guard passed — no private data patterns in changed files."
